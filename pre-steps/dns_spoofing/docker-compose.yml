services:

  dns_attacker:
    build: .
    environment:
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "53"
      SPOOF_DOMAIN: "csms.lab"
      SPOOF_ADDRESS: "172.20.0.10"
      UPSTREAM_DNS: "8.8.8.8"
      FORWARD_OTHER: "false"
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          python3 - <<'PY'
          import socket
          from dnslib import DNSRecord
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.settimeout(2)
          try:
              q = DNSRecord.question('csms.lab', 'A')
              s.sendto(q.pack(), ('127.0.0.1', 53))
              s.recvfrom(4096)
              print('dns_live')
          except Exception:
              raise SystemExit(1)
          finally:
              s.close()
          PY
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      dns_lab:
        ipv4_address: 172.20.0.2

  impersonating_csms:
    build: ../../attack_scenarios/03-CSMS-Impersonation
    environment:
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "9002"
      FORCE_RESET: "true"
      NUM_CYCLES: "5"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 9002), timeout=2); s.close()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      dns_lab:
        ipv4_address: 172.20.0.10

  cp-simulator:
    build: .
    dns:
      - 172.20.0.2
    depends_on:
      dns_attacker:
        condition: service_healthy
      impersonating_csms:
        condition: service_healthy
    environment:
      CP_ID: "CP_BENIGN_001"
      WS_URL: "ws://csms.lab:9002/"
      LOOP_SECONDS: "60"
    command: ["/bin/sh", "-c", "sleep 5 && exec python3 cp_client.py"]
    networks:
      dns_lab:
        ipv4_address: 172.20.0.20

  tcpdump:
    image: nicolaka/netshoot
    depends_on:
      cp-simulator:
        condition: service_started
    command: ["/bin/sh", "-c", "sleep 3 && tcpdump -i eth0 -nn -s 0 -U -w /data/dns_spoofing_capture.pcap 'udp port 53 or tcp port 9002 or host 172.20.0.2 or host 172.20.0.10 or host 172.20.0.20'"]
    network_mode: service:cp-simulator
    volumes:
      - ./data:/data

networks:
  dns_lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
